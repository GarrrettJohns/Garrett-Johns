<!doctype html>
<html><head><meta charset="utf-8"><title>Crownfall model viewer</title>
<style>html,body{margin:0;background:#2a2d33;overflow:hidden}canvas{display:block}#lab{position:fixed;left:0;right:0;bottom:6px;color:#eee;font:600 14px system-ui;display:flex;justify-content:space-around;pointer-events:none}</style></head>
<body><div id="lab"></div>
<script type="module">
// Art review: renders rigs and building models side by side on a plain
// backdrop, like the concept sheets. ?set=allies&kit=greenwood | enemies&kit=… |
// bosses | kings | buildings&type=castle | treant ; &view=front|back|side
import * as THREE from '../js/vendor/three.js';
import { RIGS, vcMat } from '../js/models.js';
import * as M from '../js/models.js';
import * as BK from '../js/buildings.js';
import { KINGS, KING_ORDER } from '../js/config.js';
import { allyRigs, enemyRigs, BOSS_LOOKS, treantRig } from '../js/units.js';
const q = new URLSearchParams(location.search);
const set = q.get('set') || 'allies', kit = q.get('kit') || 'greenwood', view = q.get('view') || 'front';
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio); renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x2a2d33);
scene.add(new THREE.HemisphereLight(0xeaf6ff, 0x50545a, 1.6));
const sun = new THREE.DirectionalLight(0xfff1d6, 2.4); sun.position.set(-6, 12, 8); sun.castShadow = true;
sun.shadow.camera.left = -20; sun.shadow.camera.right = 20; sun.shadow.camera.top = 20; sun.shadow.camera.bottom = -20; scene.add(sun);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(80, 40), new THREE.MeshLambertMaterial({ color: 0x3a3e46 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const items = [];
const rig = (r, name, s = 1.3) => items.push({ name, s, obj: (() => { const g = new THREE.Group(); for (const p of r.parts) { if (p.only && p.only[1] !== 0) continue; if (p.show) continue; const m = new THREE.Mesh(p.geo, vcMat); m.castShadow = true; g.add(m); } return g; })() });
const geo = (g, name, s = 1) => { const m = new THREE.Mesh(g, vcMat); m.castShadow = m.receiveShadow = true; items.push({ name, s, obj: m }); };
if (set === 'allies') { const r = allyRigs(kit); rig(r.knight, 'Guard'); rig(r.archer, 'Archer'); rig(r.raider, 'Raider'); }
else if (set === 'enemies') { const r = enemyRigs(kit); for (const [k, n] of [['grunt', 'Swordsman'], ['bowman', 'Bowman'], ['brute', 'Brute'], ['outrider', 'Outrider'], ['hound', 'Hound']]) rig(r[k], n, k === 'brute' ? 1.55 : 1.3); }
else if (set === 'bosses') { for (const [k, f] of Object.entries(BOSS_LOOKS)) rig(f(), k, 2.0); }
else if (set === 'treant') rig(treantRig(), 'Elder Treant', 2.6);
else if (set === 'kings') for (const k of KING_ORDER) rig(RIGS.hero(KINGS[k]), KINGS[k].region, 1.55);
else if (set === 'buildings') { const t = q.get('type') || 'castle'; const n = +(q.get('n') || 4); const f = BK[t + 'Geo'] || M[t + 'Geo']; for (let i = 0; i < n; i++) geo(f(i), `${t} ${i + 1}`); }
else if (set === 'walls') { const T = ['Palisade', 'Reinforced', 'Timber', 'Stone', 'Iron']; for (let i = 0; i < 5; i++) { const b = new M.Builder(); const g = new THREE.Group(); for (const [geo2, x] of [[BK.wallCornerGeo(i), -4.6], [BK.wallKitGeo(i, 2.4), -2.2], [BK.wallGateGeo(i), 1.4]]) { const m = new THREE.Mesh(geo2, vcMat); m.position.x = x; m.castShadow = true; g.add(m); } const d = new THREE.Mesh(BK.wallDoorGeo(i), vcMat); d.position.x = 1.4; g.add(d); items.push({ name: T[i], s: 0.55, obj: g }); } }
else if (set === 'siege') { for (let i = 0; i < 3; i++) { const g = new THREE.Group(); g.add(new THREE.Mesh(BK.catapultBaseGeo(i), vcMat)); const f2 = new THREE.Mesh(BK.catapultFrameGeo(i), vcMat); f2.position.y = 0.55; g.add(f2); const a = new THREE.Mesh(BK.catapultArmGeo(i), vcMat); a.position.y = 2.35; a.rotation.x = 0.5; g.add(a); g.rotation.y = 1.2; items.push({ name: ['Catapult', 'Heavy Catapult', 'Trebuchet'][i], s: 1, obj: g }); } }
// Lay out in a row.
// Bounds by hand (Box3 is not in the trimmed bundle).
const bounds = (obj) => { const lo = [1e9, 1e9, 1e9], hi = [-1e9, -1e9, -1e9]; obj.updateMatrixWorld(true); const v = new THREE.Vector3(); obj.traverse((m) => { if (!m.geometry) return; const a = m.geometry.attributes.position; for (let i = 0; i < a.count; i += 3) { v.fromBufferAttribute(a, i).applyMatrix4(m.matrixWorld); for (let k = 0; k < 3; k++) { lo[k] = Math.min(lo[k], v.getComponent(k)); hi[k] = Math.max(hi[k], v.getComponent(k)); } } }); return { min: { x: lo[0], y: lo[1] }, max: { x: hi[0], y: hi[1] } }; };
const widths = items.map((it) => { it.obj.scale.setScalar(it.s); const b = bounds(it.obj); return Math.max(1.5, b.max.x - b.min.x); });
const gap = 0.8, total = widths.reduce((a, w) => a + w + gap, -gap);
let x = -total / 2, maxH = 0;
items.forEach((it, i) => { it.obj.position.x = x + widths[i] / 2; x += widths[i] + gap; scene.add(it.obj); const b = bounds(it.obj); maxH = Math.max(maxH, b.max.y); if (view === 'back') it.obj.rotation.y = Math.PI; if (view === 'side') it.obj.rotation.y = Math.PI / 2; if (view === 'three') it.obj.rotation.y = 0.6; });
const cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 400);
const fit = Math.max(total / (2 * Math.tan(15 * Math.PI / 180) * cam.aspect), maxH / (2 * Math.tan(15 * Math.PI / 180))) * 1.15;
cam.position.set(0, maxH * 0.55 + fit * 0.18, fit); cam.lookAt(0, maxH * 0.45, 0);
renderer.render(scene, cam);
document.getElementById('lab').innerHTML = items.map((it) => `<span>${it.name}</span>`).join('');
window.ready = true;
</script></body></html>
